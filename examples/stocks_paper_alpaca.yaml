# Paper trading on Alpaca. Needs ALPACA_API_KEY / ALPACA_SECRET_KEY from the
# paper account (dashboard -> Paper -> API keys).
name: stocks-paper
mode: paper
market: stock
symbols: [SPY, QQQ]
poll_seconds: 60

broker:
  type: alpaca

data:
  source: alpaca
  timeframe: 1h
  warmup: 300

strategy:
  name: sma_cross
  params: {fast: 10, slow: 40}

risk:
  max_position_pct: 0.5
  max_daily_loss_pct: 0.03
  max_orders_per_day: 20
