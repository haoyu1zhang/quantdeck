[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdeck"
version = "0.1.0"
description = "Backtesting, paper trading and live trading for US stocks and crypto"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
crypto = ["ccxt>=4.2"]
all = ["alpaca-py>=0.30", "ccxt>=4.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
quantdeck = "quantdeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantdeck = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
